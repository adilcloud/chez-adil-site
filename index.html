<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre & description : ce qui apparaît dans Google -->
    <title>Chez Adil — Food Truck Burgers Halal à Caen</title>
    <meta
      name="description"
      content="Chez Adil, food truck de burgers halal artisanaux à Caen et alentours depuis 2016. Retrouvez nos emplacements de la semaine, notre carte, nos privatisations d'événements et nos avis clients."
    />
    <link rel="canonical" href="https://chez-adil-site-rtvw.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph : aperçu quand le lien est partagé sur WhatsApp / Instagram / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chez Adil" />
    <meta property="og:title" content="Chez Adil — Food Truck Burgers Halal à Caen" />
    <meta
      property="og:description"
      content="Burgers halal artisanaux, frites maison et privatisations d'événements. Retrouvez nos emplacements de la semaine à Caen et alentours."
    />
    <meta property="og:url" content="https://chez-adil-site-rtvw.vercel.app/" />
    <meta property="og:image" content="https://chez-adil-site-rtvw.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chez Adil — Food Truck Burgers Halal à Caen" />
    <meta
      name="twitter:description"
      content="Burgers halal artisanaux, frites maison et privatisations d'événements à Caen et alentours."
    />
    <meta name="twitter:image" content="https://chez-adil-site-rtvw.vercel.app/og-image.jpg" />

    <!-- Données structurées : aide Google à comprendre que c'est un commerce local -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "Chez Adil",
        "description": "Food truck de burgers halal artisanaux et frites maison, présent à Caen et alentours depuis 2016. Privatisations pour entreprises, anniversaires et mariages.",
        "url": "https://chez-adil-site-rtvw.vercel.app/",
        "telephone": "+33670797856",
        "servesCuisine": ["Burgers", "Halal"],
        "priceRange": "€€",
        "areaServed": {
          "@type": "City",
          "name": "Caen"
        },
        "sameAs": [
          "https://www.instagram.com/chezadilstreetfood/",
          "https://www.youtube.com/@ChezAdil-streetfood"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
